services:
  - type: web
    name: smart-library
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JAVA_OPTS
        value: "-Xmx256m"
      # Secrets — set these in the Render dashboard (Environment → Environment Variables)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
