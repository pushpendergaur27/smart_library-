# Server
server.port=${PORT:8080}

# Activate local profile for development (application-local.properties, gitignored).
# On Render, secrets come from environment variables instead.
spring.profiles.active=local

# Supabase PostgreSQL Database (Pooler) - credentials from env vars
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sslmode=require
# Supabase pooler (pgbouncer transaction mode) rejects colliding server-side
# prepared statements ("prepared statement S_N already exists") when several
# app instances connect at once (e.g. during deploys). Simple query mode +
# no server-side preparation avoids it entirely, same as the local DB URL flags.
spring.datasource.hikari.data-source-properties.prepareThreshold=-1
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Borrowing
app.borrowing.period-days=14
app.reservation.pickup-hours=24
app.borrowing.max-limit=5

# Fines (charged per day a book is overdue)
app.fine.per-day=5

# External book metadata (Google Books). Falls back to Open Library when key is absent.
app.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
