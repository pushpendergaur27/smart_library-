# Server
server.port=${PORT:8080}

# Activate local profile for development (application-local.properties, gitignored).
# On Render, secrets come from environment variables instead.
spring.profiles.active=local

# Supabase PostgreSQL Database (Pooler) - credentials from env vars
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Borrowing
app.borrowing.period-days=14
app.reservation.pickup-hours=24
app.borrowing.max-limit=5
